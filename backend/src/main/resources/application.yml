spring:
  application:
    name: smart-parking-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: native

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bcrypt-strength: 12
  auth-rate-limit-per-minute: 10
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 7d
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:ParkEase <no-reply@parkease.local>}
  storage:
    local-dir: ${STORAGE_LOCAL_DIR:uploads}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    cloudinary-url: ${CLOUDINARY_URL:}
  pricing:
    platform-fee-percent: 10
    gst-percent: 18
  payments:
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  booking:
    hold-minutes: 10
    approval-hours: 2
    max-active-holds: 3
  jobs:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health
