spring:
  application:
    name: smart-parking-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

server:
  port: ${PORT:8080}
  # Client addresses come from Tomcat's RemoteIpValve: X-Forwarded-For is honoured only from internal proxies
  # (server.tomcat.remoteip.internal-proxies, Tomcat's default private/loopback/CGNAT ranges unless set; see prod).
  forward-headers-strategy: native
  # Error bodies are built by GlobalExceptionHandler; this keeps Boot's own /error page equally quiet.
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bcrypt-strength: 12
  auth-rate-limit-per-minute: 10
  security:
    # Per client IP and minute: public reads 120, uploads and disputes 20, payment verification 30.
    rate-limit:
      public-per-minute: 120
      upload-per-minute: 20
      payment-verify-per-minute: 30
    hsts: false
    max-json-body-bytes: 1048576
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 7d
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:ParkEase <no-reply@parkease.local>}
  storage:
    local-dir: ${STORAGE_LOCAL_DIR:uploads}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    cloudinary-url: ${CLOUDINARY_URL:}
  # Platform settings (fee, GST, hold/approval/lead times, price guidelines) live in the database: migration V15 seeds
  # them and admins edit them under Admin -> Settings. The pricing and booking values below are only fallbacks, used
  # when a key is missing from the platform_settings table.
  pricing:
    platform-fee-percent: 10
    gst-percent: 18
  payments:
    mock-enabled: ${PAYMENTS_MOCK_ENABLED:true}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  booking:
    hold-minutes: 10
    approval-hours: 2
    max-active-holds: 3
    request-min-lead-minutes: 30
  jobs:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
