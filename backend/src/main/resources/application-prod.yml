spring:
  datasource:
    # Neon needs TLS: DB_URL=jdbc:postgresql://<host>/<db>?sslmode=require
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Neon's free tier allows few connections and the Render instance has 512 MB.
      maximum-pool-size: 5
      minimum-idle: 1
      # Neon suspends idle compute; retire connections before the server drops them.
      max-lifetime: 300000
      connection-timeout: 30000

server:
  # Render proxies HTTPS to us over HTTP. The rate limiter reads X-Forwarded-For itself (app.security.trust-forwarded-for),
  # so the container must not consume and strip the header first.
  forward-headers-strategy: none
  shutdown: graceful

app:
  frontend-url: ${FRONTEND_URL}
  # Exact https origin(s) of the frontend; defaults to FRONTEND_URL.
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL}}
  jwt:
    secret: ${JWT_SECRET}
  security:
    trust-forwarded-for: true
    hsts: true
  payments:
    mock-enabled: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
