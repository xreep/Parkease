name: Keep alive

# Free hosting (Render) puts the API to sleep after ~15 idle minutes and waking it takes minutes. The API pings itself
# (KEEP_ALIVE_URL); this is the backup that also wakes it after a crash or restart. The health endpoint never touches
# the database, so the database can still sleep. GitHub may run scheduled jobs a few minutes late.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping the API health endpoint
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 300 https://parkease-api-pb1f.onrender.com/api/v1/health
